name: Build native Linux binaries

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing release tag to rebuild and attach to (for example v0.5.2). Leave empty for a test build."
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Test Go bridge
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: whatsapp_bridge
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || '' }}
        run: |
          if [[ -n "$RELEASE_TAG" && ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: whatsapp_bridge/go.mod
          cache: true

      - name: Resolve Go modules and generate go.sum
        run: go mod tidy

      - name: Run tests
        run: go test ./...

      - name: Run go vet
        run: go vet ./...

  build-amd64:
    name: Build native Linux AMD64 binary
    needs: test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: whatsapp_bridge
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: whatsapp_bridge/go.mod
          cache: true

      - name: Resolve Go modules and generate go.sum
        run: go mod tidy

      - name: Install static AMD64 C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Build standalone AMD64 binary (native runner, CGO enabled)
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          mkdir -p dist
          CC=musl-gcc go build -trimpath \
            -ldflags="-s -w -linkmode external -extldflags=-static" \
            -o dist/whatsapp-bridge-linux-amd64 .
          if readelf -l dist/whatsapp-bridge-linux-amd64 | grep -q INTERP; then
            echo "::error::The AMD64 binary is not statically linked"
            exit 1
          fi
          tar -czf dist/whatsapp-bridge-linux-amd64.tar.gz -C dist whatsapp-bridge-linux-amd64

      - name: Upload standalone AMD64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: whatsapp-bridge-linux-amd64
          path: |
            whatsapp_bridge/dist/whatsapp-bridge-linux-amd64
            whatsapp_bridge/dist/whatsapp-bridge-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 30

  build-arm64:
    name: Build native Linux ARM64 binary
    needs: test
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: whatsapp_bridge
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: whatsapp_bridge/go.mod
          cache: true

      - name: Resolve Go modules and generate go.sum
        run: go mod tidy

      - name: Install static ARM64 C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Build standalone ARM64 binary (native runner, CGO enabled)
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          mkdir -p dist
          CC=musl-gcc go build -trimpath \
            -ldflags="-s -w -linkmode external -extldflags=-static" \
            -o dist/whatsapp-bridge-linux-arm64 .
          if readelf -l dist/whatsapp-bridge-linux-arm64 | grep -q INTERP; then
            echo "::error::The ARM64 binary is not statically linked"
            exit 1
          fi
          tar -czf dist/whatsapp-bridge-linux-arm64.tar.gz -C dist whatsapp-bridge-linux-arm64

      - name: Upload standalone ARM64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: whatsapp-bridge-linux-arm64
          path: |
            whatsapp_bridge/dist/whatsapp-bridge-linux-arm64
            whatsapp_bridge/dist/whatsapp-bridge-linux-arm64.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish-release-assets:
    name: Attach AMD64 and ARM64 binaries to GitHub Release
    if: github.event_name == 'release' || inputs.release_tag != ''
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download AMD64 artifact
        uses: actions/download-artifact@v8
        with:
          name: whatsapp-bridge-linux-amd64
          path: dist

      - name: Download ARM64 artifact
        uses: actions/download-artifact@v8
        with:
          name: whatsapp-bridge-linux-arm64
          path: dist

      - name: Generate checksums
        run: |
          cd dist
          sha256sum whatsapp-bridge-linux-amd64 whatsapp-bridge-linux-amd64.tar.gz \
            whatsapp-bridge-linux-arm64 whatsapp-bridge-linux-arm64.tar.gz > SHA256SUMS

      - name: Attach binaries and checksums to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/whatsapp-bridge-linux-amd64 \
            dist/whatsapp-bridge-linux-amd64.tar.gz \
            dist/whatsapp-bridge-linux-arm64 \
            dist/whatsapp-bridge-linux-arm64.tar.gz \
            dist/SHA256SUMS --clobber
