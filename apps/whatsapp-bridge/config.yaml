name: WhatsApp Bridge
slug: whatsapp-bridge
version: "0.5.1"
description: WhatsApp Web bridge for the WhatsApp Notifier integration
url: https://github.com/anonymous-writer/ha-whatsapp-notifier
image: ghcr.io/anonymous-writer/ha-whatsapp-notifier
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
host_network: false
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: WhatsApp Bridge API
webui: "http://[HOST]:[PORT:8099]/qr?token={{ .api_token }}"
options:
  api_token: ""
  pairing_phone: ""
environment:
  API_TOKEN: "{{ .api_token }}"
  PAIRING_PHONE: "{{ .pairing_phone }}"
  DATA_DIR: /data
  AUTH_DIR: /data/auth
schema:
  api_token: password
  pairing_phone: str?
map:
  - data:rw
options_description:
  api_token: Optional but strongly recommended. Use the same token in the Home Assistant integration.
  pairing_phone: Optional phone number in international format, digits only, for pairing-code login instead of QR.
